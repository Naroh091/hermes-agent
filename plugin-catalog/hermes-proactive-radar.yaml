name: hermes-proactive-radar
repo: https://github.com/Naroh091/hermes-proactive-radar
sha: 945253cf475eb7b7f1c583ff43aede7bcdc7354f
version: "0.3.1"
screenshots:
  - https://raw.githubusercontent.com/Naroh091/hermes-proactive-radar/945253cf475eb7b7f1c583ff43aede7bcdc7354f/assets/panel.png
title: Hermes Radar
description: "Proactive assistant: follows your mail, calendar, GitHub, scheduled jobs and your own chats with the agent as long-lived tasks (trips, purchases, work items, commitments), does the legwork itself and writes to you first, on the gateway platform you choose, only when something is yours to decide. Sending email always asks; paying, booking, deploying and merging never run on their own. Disclosure — runs a scheduler task inside the gateway and delegates bounded work to 'hermes chat --oneshot' child processes (2 at a time, 100 a day by default); reaches mail and calendar only through the MCP servers or command-line tools you configure and GitHub through gh; with Gmail push enabled, listens on 127.0.0.1:8666; reads the host session store (state.db, read-only), cron job outputs and the host memory provider; stores tasks, bounded snippets, facts and an audit log in HERMES_HOME/radar/radar.sqlite3 with retention limits; two optional secrets read through the host secret scope; installed disabled and in shadow mode; no telemetry."
maintainer: Naroh091
tier: community
category: automation
requires_hermes: ">=0.22.0"
docs_url: https://github.com/Naroh091/hermes-proactive-radar/blob/main/docs/onboarding.md
capabilities:
  provides_tools:
    - radar_status
    - radar_tasks
    - radar_task
    - radar_resolve
    - radar_explain
    - radar_list
    - radar_inspect
    - radar_propose
    - radar_preference
  provides_hooks:
    - on_session_start
    - post_llm_call
    - subagent_stop
    - post_compaction
    - pre_gateway_dispatch
    - pre_llm_call
    - pre_tool_call
  provides_middleware: []
  requires_env: []

